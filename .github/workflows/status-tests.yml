# Unit tests for stage2/status.py on synthetic recordings. No network, no data branch, nothing pushed.
name: status-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
