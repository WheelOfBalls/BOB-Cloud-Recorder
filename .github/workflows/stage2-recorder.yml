# Stage 2 cloud recorder. Public read-only Kalshi and Deribit data; no secrets, no accounts, no orders.
# Each run loops for about 5h40m, taking one snapshot per 5-minute slot, and pushes every snapshot to the
# stage2-data branch. As soon as a run starts it queues its own successor (workflow_dispatch), which waits
# in the concurrency group and starts when this run ends. GitHub's cron turned out to fire only a few times
# a day here, so the chain carries the recording and the cron is only a backup that restarts a broken chain.
# The concurrency group keeps exactly one run recording and at most one waiting (a newer waiting run
# replaces an older one), so runs never overlap and no slot is taken twice. After stage2/end_utc.txt a run
# exits at once and queues nothing, so the chain ends by itself. Actual timings are in data/cloud_loop.csv
# and in each snapshot.
name: stage2-recorder

on:
  schedule:
    - cron: "11,31,51 * * * *"   # off the top of the hour, when GitHub drops the most scheduled runs
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "How long this run records (minutes). Use 12 for a quick test."
        default: "340"

permissions:
  contents: write
  actions: write   # to queue the next run

concurrency:
  group: stage2-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Check out the data branch
        run: |
          python3 - <<'EOF' || { echo "Recording window is over."; echo "over=true" >> "$GITHUB_ENV"; }
          import datetime as dt, sys
          end = dt.datetime.fromisoformat(open("stage2/end_utc.txt").read().strip())
          sys.exit(0 if dt.datetime.now(dt.timezone.utc) < end else 1)
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stage2-data >/dev/null; then
            git fetch -q origin stage2-data
            git worktree add -q -B stage2-data _data origin/stage2-data
          else
            git worktree add -q --orphan -b stage2-data _data
          fi
      - name: Queue the next run
        if: env.over != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run stage2-recorder.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f max_minutes=340 \
            || echo "::warning::Could not queue the next run; the cron is the only backup now."
      - name: Record
        if: env.over != 'true'
        env:
          BOB_CRON: ${{ github.event.schedule }}
        run: python3 -I stage2/cloud_loop.py --data _data --max-minutes "${{ inputs.max_minutes || '340' }}"
